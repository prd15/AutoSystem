name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    name: build e testes (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers usa o Docker ja disponivel no runner ubuntu.
      - name: Build e testes
        run: ./mvnw -B verify
